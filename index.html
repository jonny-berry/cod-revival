<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COD Revival</title>
  <link rel="icon" href="images/favicon.png">
  <!-- Phudu font import -->
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Phudu:wght@300..900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a href="index.html">
      <img class="header-logo" src="images/cod-revival-column-logo.png" alt="">
    </a>
  </header>
  <h1 class="hero">Let’s Revive <br>the <span class="highlight">OG CODs</span></h1>
  <div class="section-divider"></div>
  <div class="info-section">
    <h2>OG COD week <br>is <span class="highlight">1/3 to 1/10</span></h2>
    <h2><span class="highlight">Play any OG COD</span><br><span class="highlight">on any platform</span><br>to participate in OCW</h2>
  </div>
  <div class="section-divider"></div>
  <h2>RSVP Form</h2>
  <form class="rsvp-form" method="POST">
    <label for="first_name">First Name<span class="required-field">*</span></label>
    <input type="text" id="first_name" name="first_name" required>
      <label for="email">Email <span class="no-spam">(get reminders about ocw. no spam ever.)</span></label>
    <input type="email" id="email" name="email">
    <button class="rsvp-button" type="submit">Submit RSVP</button>
  </form>
  <div class="rsvp-goal-container">
    <p>Goal 100K RSVPs</p>
    <p><span class="rsvp-count">0</span> current RSVPs</p>
  </div>
  <div class="section-divider"></div>
  <footer>
    <div class="social-media-icons">
      <a href="https://www.youtube.com/@CODRevival" target="_blank">
        <img src="images/social-media-logos/youtube.svg" alt="">
      </a>
      <a href="https://www.instagram.com/codrevival/" target="_blank">
        <img src="images/social-media-logos/instagram.svg" alt="">
      </a>
      <a href="https://www.tiktok.com/@codrevivalocw" target="_blank">
        <img src="images/social-media-logos/tiktok.svg" alt="">
      </a>
      <a href="https://buymeacoffee.com/codrevival" target="_blank">
        <img src="images/social-media-logos/buymeacoffee.svg" alt="">
      </a>
      <a href="https://github.com/jonny-berry/cod-revival" target="_blank">
        <img src="images/social-media-logos/github.svg" alt="">
      </a>
    </div>
    <p><a href="mailto:codrevivalwcw@gmail.com">codrevivalwcw@gmail.com</a></p>
    <a href="privacy-policy.html">
      <p>privacy policy</p>
    </a>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
